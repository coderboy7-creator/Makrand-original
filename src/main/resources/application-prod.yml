spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/makaranda}
    username: ${DATABASE_USER:makaranda}
    password: ${DATABASE_PASSWORD:makaranda}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  h2:
    console:
      enabled: false

makaranda:
  jwt-secret: ${MAKARANDA_JWT_SECRET}
